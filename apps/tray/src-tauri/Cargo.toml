[package]
name = "fleet-tray"
version = "0.1.0"
description = "Tray app for managing a fleet node's local project mappings"
edition = "2024"
license = "MIT"
publish = false

# A workspace of its own, so the root workspace (crates/*) neither builds nor locks the GUI stack.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# The node's file formats and mapping rules, shared with the node instead of re-implemented.
# A light crate, so the tray does not compile the node's network stack.
fleet-node-config = { path = "../../../crates/node-config" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
