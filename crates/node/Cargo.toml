[package]
name = "fleet-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fleet-proto.workspace = true
fleet-net.workspace = true
fleet-node-config.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
rand.workspace = true
data-encoding.workspace = true
which = "8"
clap.workspace = true
# Self-update (`update.rs`): fetching a release and checking it against its SHA-256 sums. The same
# versions the rest of the tree already builds (iroh pulls all three), so this adds nothing to
# compile. `rustls-no-provider` keeps TLS on ring, installed as the process default before use.
# `sha2` is also the hash `fleet agent attach` sends with a file, so the orchestrator can tell it
# arrived whole.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
win32job = "2.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
