[package]
name = "fleet-feeds"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only feeds from external chat channels (Slack first): polled with the user's own token, or pushed through Slack Socket Mode."

[dependencies]
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# `rustls-no-provider` keeps TLS on ring (which iroh already uses) instead of compiling aws-lc;
# `Api::new` installs ring as the process default. `query` is opt-in since reqwest 0.13.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The same verifier reqwest uses, so the Socket Mode WebSocket trusts exactly what the Web API
# calls trust.
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
# Already in the tree through iroh-relay; these are the features it enables, so adding the
# Socket Mode client compiles nothing new and changes nothing for the relay. TLS is our own
# rustls connector on ring (`rustls-bring-your-own-connector`).
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client", "getrandom", "rand", "ring", "rustls-bring-your-own-connector", "sha1_smol"] }
tracing = "0.1.41"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.48.0", features = ["full", "test-util"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["server", "sha1_smol"] }
