[package]
name = "fleet-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fleet-proto.workspace = true
fleet-net.workspace = true
fleet-node-config.workspace = true
fleet-telegram = { path = "../telegram" }
fleet-feeds = { path = "../feeds" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rand.workspace = true
data-encoding.workspace = true
iroh.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["form", "query"] }
# The web UI is compiled into the binary: one artefact to deploy, and the UI can never be out
# of step with the API it talks to. `debug-embed` makes a debug build behave like a release
# one, instead of reading the files from disk at runtime.
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
chacha20poly1305 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
async-trait = "0.1"
form_urlencoded = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
# Wakeup conditions the brain writes (see `wakeups`): pure Rust, sandboxed, no stdlib I/O, and
# limited per evaluation. `serde` is for turning stored JSON into script values.
rhai = { version = "1", features = ["serde"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Paused time for the "typing…" tests.
tokio = { workspace = true, features = ["test-util"] }
fleet-node = { path = "../node" }
# A stand-in Jira, so the client is tested against real request and response shapes.
wiremock = "0.6"
# Calls the web router in-process (`oneshot`), so the API is tested through axum — routing,
# extractors and status codes included — without binding a port.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
