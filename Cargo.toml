[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Forevka/agent-management"

[workspace.dependencies]
fleet-proto = { path = "crates/proto" }
fleet-net = { path = "crates/net" }
fleet-node-config = { path = "crates/node-config" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh = "1.4"
uuid = { version = "1", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tokio-util = "0.7"
rand = "0.9"
data-encoding = "2"
