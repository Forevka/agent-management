name: CI

on:
  push:
    # Work branches too, so a pushed branch is checked before it has a pull request.
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a work branch supersedes the running check; main always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The web UI is its own build (TypeScript, then Vite). The Rust jobs do not need it: when
  # apps/web/dist is missing, crates/orchestrator's build.rs embeds a placeholder page, so a
  # Rust-only change needs no node. This job is what proves the real UI still compiles.
  web:
    name: web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build

  test-linux:
    name: test (linux, postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Postgres-backed tests run only when this is set.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-windows:
    name: build + test (windows)
    runs-on: windows-latest
    # No TEST_DATABASE_URL here: the Postgres-backed tests skip themselves.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The tray app is a Cargo workspace of its own, with its own target dir.
          workspaces: |
            . -> target
            apps/tray/src-tauri -> target
      - run: cargo build --workspace --locked
      # Windows-only code (the tray launch, job objects) is linted only here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # The tray app (apps/tray): Windows only, shipped next to fleet.exe.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tray/package-lock.json
      - name: Tray frontend deps
        working-directory: apps/tray
        run: npm ci
      - name: Tray checks
        working-directory: apps/tray
        run: npm run check
      - name: Tray version matches the workspace
        # The tray ships with fleet.exe and takes its version (tauri.conf.json has none).
        shell: bash
        run: |
          set -euo pipefail
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tray=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/tray/src-tauri/Cargo.toml | head -n1)
          echo "workspace $ws, tray $tray"
          test "$ws" = "$tray"
      - name: Tray fmt
        working-directory: apps/tray/src-tauri
        run: cargo fmt --check
      - name: Tray clippy
        working-directory: apps/tray/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tray test
        working-directory: apps/tray/src-tauri
        run: cargo test --locked
      - name: Tray release build
        working-directory: apps/tray
        # bash: PowerShell's npm wrapper drops the `--` separators.
        shell: bash
        run: npm run tauri build -- --no-bundle -- --locked
