name: CI

on:
  push:
    # Work branches too, so a pushed branch is checked before it has a pull request. `fleet/**`
    # and `retro/**` are the fleet's own agents' branches: until they were listed here, no agent
    # branch was checked before it reached main, and a merge to main is now a deploy.
    branches: [main, 'fix/**', 'feat/**', 'fleet/**', 'retro/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a work branch supersedes the running check; main always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The web UI is its own build (TypeScript, then Vite). The Rust jobs do not need it: when
  # apps/web/dist is missing, crates/orchestrator's build.rs embeds a placeholder page, so a
  # Rust-only change needs no node. This job is what proves the real UI still compiles.
  web:
    name: web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build

  test-linux:
    name: test (linux, postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Postgres-backed tests run only when this is set.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-windows:
    name: build + test (windows)
    runs-on: windows-latest
    # No TEST_DATABASE_URL here: the Postgres-backed tests skip themselves.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # The tray app is a Cargo workspace of its own, with its own target dir.
          workspaces: |
            . -> target
            apps/tray/src-tauri -> target
      - run: cargo build --workspace --locked
      # Windows-only code (the tray launch, job objects) is linted only here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      # The tray app (apps/tray): Windows only, shipped next to fleet.exe.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tray/package-lock.json
      - name: Tray frontend deps
        working-directory: apps/tray
        run: npm ci
      - name: Tray checks
        working-directory: apps/tray
        run: npm run check
      - name: Tray version matches the workspace
        # The tray ships with fleet.exe and takes its version (tauri.conf.json has none).
        shell: bash
        run: |
          set -euo pipefail
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tray=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/tray/src-tauri/Cargo.toml | head -n1)
          echo "workspace $ws, tray $tray"
          test "$ws" = "$tray"
      - name: Tray fmt
        working-directory: apps/tray/src-tauri
        run: cargo fmt --check
      - name: Tray clippy
        working-directory: apps/tray/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tray test
        working-directory: apps/tray/src-tauri
        run: cargo test --locked
      - name: Tray release build
        working-directory: apps/tray
        # bash: PowerShell's npm wrapper drops the `--` separators.
        shell: bash
        run: npm run tauri build -- --no-bundle -- --locked

  # A green main is a release, and a release is rolled out to every machine (deploy/README.md).
  # The owner's merge is the one gate, so every check above must pass first, on the exact commit
  # that gets tagged.
  release:
    name: Tag and release
    needs: [fmt, clippy, web, test-linux, test-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write # dispatch release.yml
    # Two merges in quick succession must not both read the same latest tag and mint the same
    # next one: releases are cut one at a time, in order.
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # every tag, to find the latest
      - name: Next version
        id: next
        run: |
          set -euo pipefail
          # A re-run of this job on a commit that is already a release releases it again rather
          # than minting a second version of the same code.
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_SHA is already $existing"
            exit 0
          fi
          # Stable versions only: a hand-made prerelease (v0.3.0-rc.1) is not the line to count from.
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n1 || true)
          if [ -z "$last" ]; then
            next=v0.2.0
          else
            IFS=. read -r maj min pat <<<"${last#v}"
            next="v${maj}.${min}.$((pat + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "latest ${last:-none}, next $next"
      - name: Tag the commit CI just checked
        if: steps.next.outputs.new == 'true'
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      # A tag pushed with GITHUB_TOKEN starts no workflow, so the release is dispatched at the tag
      # explicitly; `workflow_dispatch` is the documented exception to that rule.
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
