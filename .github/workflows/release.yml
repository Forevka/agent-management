name: Release

# Push a tag like v0.1.0 (or v0.2.0-rc.1, published as a prerelease) to build
# the `fleet` binaries, attach them to a GitHub release with SHA-256 sums, and
# push the orchestrator image to ghcr.io/<owner>/fleet.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-linux:
    name: build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    # Built on Debian bookworm (glibc 2.36), the same base as the Docker image,
    # so the binary also runs on hosts older than the runner's Ubuntu.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      - name: Build
        run: cargo build --release --locked --package fleet --bin fleet
      - name: Stage asset
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp target/release/fleet "dist/fleet-${TAG#v}-x86_64-unknown-linux-gnu"
      - uses: actions/upload-artifact@v7
        with:
          name: fleet-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: build x86_64-pc-windows-msvc
    runs-on: windows-latest
    env:
      # Static CRT: the exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - name: Build
        run: cargo build --release --locked --package fleet --bin fleet --target x86_64-pc-windows-msvc
      - name: Stage asset
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/fleet.exe "dist/fleet-${TAG#v}-x86_64-pc-windows-msvc.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: fleet-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: fleet-*
          merge-multiple: true
      - name: SHA-256 sums
        working-directory: dist
        run: |
          set -euo pipefail
          for f in fleet-*; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum fleet-* | grep -v '\.sha256$' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  docker:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Image name
        id: image
        # Registry paths must be lowercase; GitHub owners may not be.
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/fleet" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # `latest` only for non-prerelease versions.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
