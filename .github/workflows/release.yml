name: Release

# Push a tag like v0.1.0 (or v0.2.0-rc.1, published as a prerelease) to build
# the `fleet` binaries (and the Windows tray app, fleet-tray), attach them to a
# GitHub release with SHA-256 sums, and push the orchestrator image to
# ghcr.io/<owner>/fleet.

on:
  push:
    tags: ["v*"]
  # How every release actually starts: CI tags a green main and dispatches this at the tag (see
  # the `release` job in ci.yml). A tag pushed with GITHUB_TOKEN starts no workflow on its own —
  # GitHub's guard against recursive runs — and `workflow_dispatch` is the documented exception.
  # The `push` trigger stays for a tag pushed by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Baked into every binary (`fleet_proto::BUILD_VERSION`) so a machine can say which release it
  # runs and the fleet can tell which ones are behind. Without it every build reports 0.1.0.
  FLEET_VERSION: ${{ github.ref_name }}

jobs:
  # A dispatch from a branch would publish a "release" named after the branch, with binaries
  # from wherever that branch happened to be. Only a tag is a release.
  guard:
    name: Only a v* tag is a release
    runs-on: ubuntu-latest
    steps:
      - name: Check the ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) echo "releasing $REF" ;;
            *) echo "::error::release.yml runs on a v* tag, not on $REF"; exit 1 ;;
          esac

  build-linux:
    needs: guard
    name: build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    # Built on Debian bookworm (glibc 2.36), the same base as the Docker image,
    # so the binary also runs on hosts older than the runner's Ubuntu.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
      # The web UI is embedded into the binary, so it is built first. Without this the
      # release would ship build.rs's "the UI was not built" placeholder.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the web UI
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Build
        run: cargo build --release --locked --package fleet --bin fleet
      - name: Stage asset
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp target/release/fleet "dist/fleet-${TAG#v}-x86_64-unknown-linux-gnu"
      - uses: actions/upload-artifact@v7
        with:
          name: fleet-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: build x86_64-pc-windows-msvc
    needs: guard
    runs-on: windows-latest
    env:
      # Static CRT: the exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
          # The tray app is a Cargo workspace of its own, with its own target dir.
          workspaces: |
            . -> target
            apps/tray/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/tray/package-lock.json
      # Embedded into fleet.exe, so it comes before the cargo build.
      - name: Build the web UI
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Build
        run: cargo build --release --locked --package fleet --bin fleet --target x86_64-pc-windows-msvc
      - name: Tray version matches the workspace
        # The tray takes its version from its Cargo.toml (tauri.conf.json has none), which must
        # follow the workspace's, as fleet.exe's does.
        shell: bash
        run: |
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tray=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/tray/src-tauri/Cargo.toml | head -n1)
          echo "workspace $ws, tray $tray"
          test "$ws" = "$tray"
      - name: Build tray
        working-directory: apps/tray
        # bash: PowerShell's npm wrapper drops the `--` separators.
        shell: bash
        run: |
          npm ci
          npm run tauri build -- --no-bundle --target x86_64-pc-windows-msvc -- --locked
      - name: Stage assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/fleet.exe "dist/fleet-${TAG#v}-x86_64-pc-windows-msvc.exe"
          cp apps/tray/src-tauri/target/x86_64-pc-windows-msvc/release/fleet-tray.exe "dist/fleet-tray-${TAG#v}-x86_64-pc-windows-msvc.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: fleet-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: fleet-*
          merge-multiple: true
      - name: SHA-256 sums
        working-directory: dist
        run: |
          set -euo pipefail
          for f in fleet-*; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum fleet-* | grep -v '\.sha256$' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          # Explicit, since a dispatched run is not a tag push and the action would otherwise guess.
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  docker:
    name: Docker image (ghcr.io)
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Image name
        id: image
        # Registry paths must be lowercase; GitHub owners may not be.
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/fleet" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # `latest` only for non-prerelease versions.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            FLEET_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
